name: Release Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-assets.yml'
      - 'app/**'
      - 'assets/**'
      - 'installer/**'
      - 'WhaleGirlPet.spec'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Read version from paths.py
        run: |
          $m = Select-String -Path app\paths.py -Pattern 'APP_VERSION = "([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          "VER=$ver" >> $env:GITHUB_ENV
          Write-Output "building v$ver"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 edge-tts psutil pycaw pyinstaller "aiohttp<4" tabulate certifi comtypes

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean WhaleGirlPet.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\whale_pet.iss

      - name: Pack portable, source, checksums
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist\WhaleGirlPet.exe pkg\
          if (Test-Path README.md) { Copy-Item README.md pkg\ }
          # v3.0.4：免安装版也得带本地推理引擎，否则解压后即使装了模型也跑不起来
          if (Test-Path runtime\dafeiyu) {
            New-Item -ItemType Directory -Force pkg\runtime | Out-Null
            Copy-Item -Recurse runtime\dafeiyu pkg\runtime\dafeiyu
            Write-Output "portable 已带 runtime\dafeiyu"
          }
          $ver = $env:VER
          Compress-Archive -Path pkg\* -DestinationPath "dist\WhaleGirlPet-$ver-portable.zip" -Force -CompressionLevel Optimal
          git archive --format=zip --prefix="WhaleGirlPet-$ver/" -o "dist\WhaleGirlPet-$ver-source.zip" HEAD
          Get-ChildItem dist -Filter "*$ver*" -File |
            Where-Object { $_.Name -notlike "*.sha256" } |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)" | Out-File -Encoding ascii -NoNewline ($_.FullName + ".sha256")
            }
          Get-ChildItem dist -Filter "*$ver*" -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload assets to Release
        env:
          # 用仓库 owner 的令牌发布，Release 页面上显示成 cnbprd 本人，
          # 而不是 github-actions[bot]。没配这个 secret 时退回默认令牌。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $ver = $env:VER
          $tag = "v$ver"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notesFile = "docs\releases\v$ver.md"
            if (Test-Path $notesFile) {
              gh release create $tag --target $env:GITHUB_SHA --title "鲸鱼娘桌宠 $ver" --notes-file $notesFile
            } else {
              gh release create $tag --target $env:GITHUB_SHA --title "鲸鱼娘桌宠 $ver" --notes "由 GitHub Actions 自动构建（$env:GITHUB_SHA）。发布说明尚未编写。"
            }
          }
          $files = Get-ChildItem dist -Filter "*$ver*" -File | ForEach-Object { $_.FullName }
          gh release upload $tag $files --clobber
