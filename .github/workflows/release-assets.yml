name: Release Assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 edge-tts psutil pycaw pyinstaller "aiohttp<4" tabulate certifi comtypes

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean WhaleGirlPet.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\whale_pet.iss

      - name: Pack portable, source, checksums
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist\WhaleGirlPet.exe pkg\
          if (Test-Path README.md) { Copy-Item README.md pkg\ }
          Compress-Archive -Path pkg\* -DestinationPath dist\WhaleGirlPet-2.9.3-portable.zip -Force
          git archive --format=zip --prefix=WhaleGirlPet-2.9.3/ -o dist\WhaleGirlPet-2.9.3-source.zip HEAD
          Get-ChildItem dist -Filter "*2.9.3*" -File |
            Where-Object { $_.Name -notlike "*.sha256" } |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)" | Out-File -Encoding ascii -NoNewline ($_.FullName + ".sha256")
            }
          Get-ChildItem dist -Filter "*2.9.3*" -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload assets to Release v2.9.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -Filter "*2.9.3*" -File | ForEach-Object { $_.FullName }
          gh release upload v2.9.3 $files --clobber
