name: Release Notes

# Manual, tag-scoped update. Do not restore the old push trigger: it edited
# every existing release whenever any docs/releases/*.md file changed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update, for example v3.2.0-sprite'
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Apply notes to one release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "notes file missing: $notes" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release does not exist: $TAG" >&2
            exit 1
          fi
          gh release edit "$TAG" --notes-file "$notes"
